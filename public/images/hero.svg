<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1d3b"/>
      <stop offset="50%" stop-color="#091424"/>
      <stop offset="100%" stop-color="#060d17"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.7" fill="#fff" opacity="0.04"/>
      <circle cx="70" cy="40" r="0.8" fill="#fff" opacity="0.03"/>
      <circle cx="45" cy="80" r="0.6" fill="#fff" opacity="0.05"/>
      <circle cx="85" cy="15" r="0.5" fill="#fff" opacity="0.03"/>
      <circle cx="10" cy="65" r="0.7" fill="#fff" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="960" height="540" fill="url(#bg)"/>
  
  <!-- Subtle photographic framing & golden ratio lines -->
  <line x1="316.8" y1="0" x2="316.8" y2="540" stroke="#38bdf8" stroke-width="0.5" opacity="0.08"/>
  <line x1="633.6" y1="0" x2="633.6" y2="540" stroke="#38bdf8" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="178.20000000000002" x2="960" y2="178.20000000000002" stroke="#38bdf8" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="356.40000000000003" x2="960" y2="356.40000000000003" stroke="#38bdf8" stroke-width="0.5" opacity="0.08"/>
  
  <!-- Film Grain Pattern -->
  <rect width="960" height="540" fill="url(#grain)"/>

  <!-- Center Framing Elements -->
  <rect x="30" y="30" width="900" height="480" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <rect x="40" y="40" width="880" height="460" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>

  <!-- Crosshair viewfinder markers -->
  <path d="M 40 55 L 40 40 L 55 40" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
  <path d="M 905 40 L 920 40 L 920 55" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
  <path d="M 40 485 L 40 500 L 55 500" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
  <path d="M 905 500 L 920 500 L 920 485" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>

  <!-- Icon Graphic -->
  
    <rect x="440" y="240" width="80" height="60" rx="10" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
    <circle cx="480" cy="270" r="18" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.8"/>
    <circle cx="480" cy="270" r="8" fill="#60a5fa" opacity="0.3"/>
    <rect x="460" y="230" width="20" height="10" rx="3" fill="#60a5fa" opacity="0.5"/>
  

  <!-- Vignette -->
  <rect width="960" height="540" fill="url(#vignette)"/>

  <!-- Bottom Editorial Typography Overlay -->
  <rect x="0" y="430" width="960" height="110" fill="url(#bg)" opacity="0.95"/>
  <line x1="40" y1="430" x2="920" y2="430" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>

  <text x="50" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#60a5fa" text-transform="uppercase">Weddings · LAGOS</text>
  <text x="50" y="492" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#f8fafc">The Royal Wedding Soirée</text>
  <text x="50" y="514" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Capturing unconditional celebration and romance in Victoria Island</text>

  <!-- Tublack Stamp with signature style -->
  <text x="910" y="495" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#ffffff">TuBLack</text>
  <text x="910" y="512" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="4" fill="#60a5fa">IMAGERY</text>
</svg>