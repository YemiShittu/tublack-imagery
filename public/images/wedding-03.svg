<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a36"/>
      <stop offset="50%" stop-color="#091424"/>
      <stop offset="100%" stop-color="#060e1c"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.7" fill="#fff" opacity="0.04"/>
      <circle cx="70" cy="40" r="0.8" fill="#fff" opacity="0.03"/>
      <circle cx="45" cy="80" r="0.6" fill="#fff" opacity="0.05"/>
      <circle cx="85" cy="15" r="0.5" fill="#fff" opacity="0.03"/>
      <circle cx="10" cy="65" r="0.7" fill="#fff" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Subtle photographic framing & golden ratio lines -->
  <line x1="264" y1="0" x2="264" y2="600" stroke="#38bdf8" stroke-width="0.5" opacity="0.08"/>
  <line x1="528" y1="0" x2="528" y2="600" stroke="#38bdf8" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="198" x2="800" y2="198" stroke="#38bdf8" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="396" x2="800" y2="396" stroke="#38bdf8" stroke-width="0.5" opacity="0.08"/>
  
  <!-- Film Grain Pattern -->
  <rect width="800" height="600" fill="url(#grain)"/>

  <!-- Center Framing Elements -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>

  <!-- Crosshair viewfinder markers -->
  <path d="M 40 55 L 40 40 L 55 40" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
  <path d="M 745 40 L 760 40 L 760 55" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
  <path d="M 40 545 L 40 560 L 55 560" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
  <path d="M 745 560 L 760 560 L 760 545" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>

  <!-- Icon Graphic -->
  
    <rect x="360" y="270" width="80" height="60" rx="10" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
    <circle cx="400" cy="300" r="18" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.8"/>
    <circle cx="400" cy="300" r="8" fill="#60a5fa" opacity="0.3"/>
    <rect x="380" y="260" width="20" height="10" rx="3" fill="#60a5fa" opacity="0.5"/>
  

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vignette)"/>

  <!-- Bottom Editorial Typography Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="url(#bg)" opacity="0.95"/>
  <line x1="40" y1="490" x2="760" y2="490" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>

  <text x="50" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#60a5fa" text-transform="uppercase">Weddings · LAGOS</text>
  <text x="50" y="552" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#f8fafc">Intimate Coastal Vows</text>
  <text x="50" y="574" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Landmark Beach golden hour romance</text>

  <!-- Tublack Stamp with signature style -->
  <text x="750" y="555" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#ffffff">TuBLack</text>
  <text x="750" y="572" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="4" fill="#60a5fa">IMAGERY</text>
</svg>